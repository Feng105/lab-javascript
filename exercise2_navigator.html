<!DOCTYPE html>
<html>
<head>
<title>Exercise 2 - Navigator Object</title>
</head>
<body>
<h1>Navigator Object Demo</h1>

<script>
// Demonstrates several properties of the navigator object
document.write('<p><b>navigator.userAgent:</b> ' + navigator.userAgent + '</p>');
document.write('<p><b>navigator.platform:</b> ' + navigator.platform + '</p>');
document.write('<p><b>navigator.language:</b> ' + navigator.language + '</p>');
document.write('<p><b>navigator.onLine:</b> ' + navigator.onLine + '</p>');
document.write('<p><b>navigator.cookieEnabled:</b> ' + navigator.cookieEnabled + '</p>');
// Demonstrates a method of the navigator object
document.write('<p><b>navigator.javaEnabled():</b> ' + navigator.javaEnabled() + '</p>');
</script>

</body>
</html>
